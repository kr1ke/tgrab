name: Release

# Tauri and Electron both produce native artefacts per platform, and macOS cannot
# cross-compile Windows or Linux installers. Three runners is the only honest way
# to ship all three, so the matrix — not a local build — is what fills Releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifacts: 'dist/*.dmg,dist/*.zip'
          - os: windows-latest
            script: dist:win
            artifacts: 'dist/*.exe'
          - os: ubuntu-latest
            script: dist:linux
            artifacts: 'dist/*.AppImage,dist/*.deb'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      # node-pty is OPTIONAL: it gives Windows an automated sign-in, but it is the only
      # thing here that compiles. Python 3.12 removed distutils, which node-gyp still
      # needs, so pin 3.11. If the rebuild fails anyway the build continues — the app
      # detects the missing module and falls back to opening a terminal.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild optional native modules
        working-directory: gui
        continue-on-error: true
        env:
          GYP_MSVS_VERSION: '2022'
        run: npx electron-builder install-app-deps

      - name: Build
        working-directory: gui
        run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds. macOS users get a Gatekeeper warning on first launch;
          # signing needs a paid Apple Developer certificate held as a secret.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tgrab-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
          draft: false

  cli:
    # The CLI is a Bash script — nothing to compile, just a tarball for people who
    # want it without cloning.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Package CLI
        run: tar czf tgrab-cli.tar.gz bin/ skill/ AGENTS.md README.md README.ru.md
      - uses: softprops/action-gh-release@v2
        with:
          files: tgrab-cli.tar.gz
          fail_on_unmatched_files: false
